[workspace]
name = "flyem_analysis_template"
version = "0.1.0"
description = "Add your project description here."
channels = ["flyem-forge", "conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]

[activation]
env = { PYTHONUTF8 = "1" }

[tasks]
lab = "jupyter lab --config jupyter_server_config.py"
download-eyemaps = "python src/setup_data/download_eyemaps.py"

[dependencies]
python = ">=3.11,<3.12"
numpy = ">=2,<3"
pandas = ">=2.0,<3"
scipy = ">=1.10,<2"
matplotlib = ">=3.7,<4"
seaborn = ">=0.13,<1"
scikit-learn = ">=1.6.1,<2"
networkx = ">=3.5.1,<4"
plotly = ">=5.18,<6"
tqdm = ">=4.66,<5"
h5py = ">=3.10"
pyarrow = ">=20"
neuprint-python = ">=0.6,<1"
jupyter = ">=1.1.1,<2"
ipykernel = ">=6.29.5,<7"
jupytext = ">=1.19.1,<2"
jupyterlab = ">=4.5.4,<5"

# Build dependencies for git packages
setuptools = ">=75"
pip = ">=24"

[pypi-dependencies]
python-dotenv = "==1.0.0"
connectome-interpreter = { git = "https://github.com/artxz/connectome_interpreter.git", branch = "az-eyemap-path" }
navis = { git = "https://github.com/artxz/navis.git", rev = "93de9aff5ca913407f9d85983a9f4e3c6a8c5dd5" }
