[workspace]
name = "flyem-analysis-starter"
version = "0.1.0.dev0"
description = "Starter tooling for FlyEM connectome analysis."
channels = ["flyem-forge", "conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]

[activation]
env = { PYTHONUTF8 = "1" }

[tasks]
lab = "jupyter lab --config jupyter_server_config.py"
download-eyemaps = "python -m flyem_analysis_starter.eyemap.download"
# Download and verify the prebuilt data (add --dataset <tag> or --all).
fetch-data = "python -m flyem_analysis_starter.data.fetch"
# Maintainer only: build the data from neuPrint into cache/build/<tag>
# (--dataset <tag>, --steps matrices flow, --compare); see data/build.py.
build-data = "python -m flyem_analysis_starter.data.build"
# Maintainer only: upload built files as a GitHub data release.
publish-data = "python -m flyem_analysis_starter.data.publish"

[dependencies]
python = ">=3.11,<3.12"
numpy = ">=2,<3"
pandas = ">=2.0,<3"
scipy = ">=1.10,<2"
matplotlib = ">=3.7,<4"
seaborn = ">=0.13,<1"
scikit-learn = ">=1.6.1,<2"
networkx = ">=3.5.1,<4"
plotly = ">=5.18,<6"
# Static image export (`fig.to_image`/`write_image`) — plotly itself only renders
# via JS in a browser. Pinned to 0.2.x because plotly 5.x expects the
# `kaleido.scopes.plotly` API that kaleido 1.x removed; 1.x needs plotly >=6.1.
python-kaleido = ">=0.2,<0.3"
tqdm = ">=4.66,<5"
h5py = ">=3.10"
pyarrow = ">=20"
neuprint-python = ">=0.6,<1"
jupyter = ">=1.1.1,<2"
ipykernel = ">=6.29.5,<7"
jupytext = ">=1.19.1,<2"
jupyterlab = ">=4.5.4,<5"
openpyxl = ">=3.1,<4"
platformdirs = ">=4"
shapely = ">=2"

# CPU-only conda-forge build so pip's resolver (see connectome-interpreter's
# `torch` requirement below) doesn't fall back to a PyPI wheel that bundles
# its own Intel MKL/OpenMP runtime and conflicts with conda-forge's
# llvm-openmp (numpy/scipy), crashing the kernel with an OMP #15 duplicate
# runtime error on Windows.
pytorch-cpu = ">=2.0"

# Build dependencies for git packages
setuptools = ">=75"
pip = ">=24"
alphashape = ">=1.3.1,<2"

[pypi-dependencies]
# This repository's own package, editable: changes in src/ apply without reinstalling.
flyem-analysis-starter = { path = ".", editable = true }
python-dotenv = "==1.0.0"
# Branch adding `method` to the flow functions (for config.FLOW_METHOD), on top of az-eyemap-path.
connectome-interpreter = { git = "https://github.com/artxz/connectome_interpreter.git", branch = "az-update-navis-call" }
# Branch of upstream PR navis-org/navis#202 (batched BayesianTraversalModel.run, method="legacy").
navis = { git = "https://github.com/artxz/navis.git", branch = "pr/bayesian-speedup" }
flybrains = ">=0.5.2, <0.6"
cloud-volume = ">=12.15.0, <13"

[feature.dev.dependencies]
pre-commit = "*"
nbstripout = "*"
pytest = "*"
nbconvert = "*"

[feature.dev.tasks]
test = "pytest"

[environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }
