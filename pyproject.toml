[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "flyem_analysis_template"
version = "0.1.0"

[tool.setuptools.packages.find]
where = ["src"]

[tool.jupytext]
formats = "ipynb,py:percent"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "data: needs the prebuilt files in cache/data (run `pixi run fetch-data`)",
    "neuprint: needs a neuPrint token in .env and network access",
]
