[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flyem-analysis-starter"
version = "0.1.0.dev0"
description = "Starter tooling for FlyEM connectome analysis: data access, connectivity helpers, hex-lattice placement and neuron plotting."
readme = "README.md"
requires-python = ">=3.11"
# Core: enough for config, the data loaders and the eyemap helpers. The heavier
# stack is in the extras below; the Pixi environment installs all of it.
dependencies = [
    "numpy>=2",
    "pandas>=2",
    "scipy>=1.10",
    "platformdirs>=4",
    "python-dotenv>=1.0",
    "tqdm>=4.66",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
neuprint = ["neuprint-python>=0.6"]
plotting = [
    "neuprint-python>=0.6",
    "navis>=1.10",
    "cloud-volume>=12.15",
    "matplotlib>=3.7",
    "plotly>=5.18,<6",
    "alphashape>=1.3.1",
    "shapely>=2",
    "pillow",
    "ipython",
    "scikit-learn>=1.6",
]
analysis = ["connectome-interpreter"]
all = ["flyem-analysis-starter[neuprint,plotting,analysis]"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["flyem_analysis_starter*"]

[tool.setuptools.package-data]
flyem_analysis_starter = ["params/**/*"]

[tool.jupytext]
formats = "ipynb,py:percent"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "data: needs the prebuilt files in cache/data (run `pixi run fetch-data`)",
    "neuprint: needs a neuPrint token in .env and network access",
]
